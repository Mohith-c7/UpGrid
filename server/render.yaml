# Render Blueprint (no Dockerfile). Region: Singapore.
# One web service runs the API AND every background worker (reminders, announcements, pipeline slot/offer expiry, assessment
# auto-submit/reminders/code judging) in-process, so no separate worker or cron service is needed. Keep it at one instance
# (workers are idempotent, but one is plenty); to move them out later set DISABLE_SCHEDULER=1 here and add a background worker.
# Secrets are declared with sync: false (key only, no value): Render asks for them when the Blueprint is created.
databases:
  - name: placement-os-db
    region: singapore
    plan: basic-256mb
    databaseName: placement_os
    user: placement_os

services:
  - type: web
    name: placement-os-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are plain idempotent SQL (CREATE ... IF NOT EXISTS); they never drop or wipe data. Never run seed here.
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /health # 200 {status:ok} when Postgres answers, 503 otherwise
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: placement-os-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OFFICER_INVITE_CODE
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      # ---- Integrations. Paste the values in the Render dashboard (sync: false = never stored in git).
      # Every group is optional: leave it empty and that feature switches itself off. See INTEGRATIONS.md.
      - key: APP_NAME
        value: Placement OS
      # Email (SMTP)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REQUIRE_VERIFIED_EMAIL
        sync: false
      # Google sign-in
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Cloudflare Turnstile
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # Judge0 (coding tests)
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      # Gemini (AI): AI Studio key OR Vertex (project + location + credentials JSON)
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: asia-south1
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: AI_DAILY_LIMIT
        value: 30
      - key: AI_ENABLED
        value: "true"
      - key: AI_DAILY_LIMIT_STAFF
        sync: false
      - key: AI_REQUIRE_CANDIDATE_CONSENT
        sync: false
      # Optional tuning
      - key: JUDGE0_LANGUAGE_IDS
        sync: false
      - key: SCHEDULER_INTERVAL_MS
        sync: false
      - key: DISABLE_SCHEDULER
        sync: false
      # Never set SEED_FORCE here: `npm run seed` wipes data.
